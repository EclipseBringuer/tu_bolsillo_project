version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: tu_bolsillo_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 15112004
      MYSQL_DATABASE: tu_bolsillo_db
      MYSQL_USER: tu_bolsillo_user
      MYSQL_PASSWORD: 15112004
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "4321:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker-config/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tu_bolsillo_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/tu_bolsillo_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: tu_bolsillo_user
      SPRING_DATASOURCE_PASSWORD: 15112004
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
