services:
  # Base de datos MySQL
  db:
    image: mysql:8.0
    container_name: tu_bolsillo_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    command:
      [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
        "--skip-character-set-client-handshake",
      ]
    ports:
      - "4321:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker-config/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      start_period: 30s

  # Servicio Redis para una blacklist de tokens de acceso
  redis:
    image: redis:7.4-alpine
    container_name: tu_bolsillo_redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]

  # Backend con Spring Boot
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tu_bolsillo_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Frontend con Angular
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tu_bolsillo_frontend
    restart: always
    ports:
      - "4200:80"

volumes:
  db_data:
