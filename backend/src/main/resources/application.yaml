#Configuración de spring
spring:
  application:
    name: TuBolsillo
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO}
  data:
    redis:
      host: redis
      port: 6379
      password: ${SPRING_DATA_REDIS_PASSWORD}

# Configuración de la documentación
springdoc:
  swagger-ui:
    path: /api/docs
  api-docs:
    path: /api/docs/api-docs

# Configuración de JSON Web Token
jwt:
  secret: Yn8ycCmd0csc6RbloLo2URZy8Unu2Mtk1/KW4/0dtcQ=
  refresh:
    expiration: 604800000 # 7 días
  access:
    expiration: 3600000 # 1 hora = 3600 segundos * 1000 milisegundos/segundo


